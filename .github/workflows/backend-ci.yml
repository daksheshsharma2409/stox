name: Backend CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    backend-tests:
        name: Backend Tests
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: stox_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d stox_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        defaults:
            run:
                working-directory: backend

        env:
            NODE_ENV: test
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stox_test?schema=public

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 26
                  cache: npm
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Validate Prisma schema
              run: npx prisma validate

            - name: Generate Prisma client
              run: npx prisma generate

            - name: Apply database migrations
              run: npx prisma migrate deploy

            - name: Run backend tests
              run: npm test -- --runInBand
